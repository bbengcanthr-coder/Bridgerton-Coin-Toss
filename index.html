<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridgerton Coin Toss | SSU x BCU</title>
    <!-- เรียกดึงฟอนต์หรูหรา -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- หน้าลงทะเบียนชื่อ -->
        <div id="login-screen" class="screen active">
            <h1 class="title">The Ton's Wager</h1>
            <p class="subtitle">ค่ำคืนแห่งการประชัน #BridgertonNightSSUxBCU</p>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="นามของท่าน (เลดี้/คุณชาย)..." maxlength="20">
                <button id="startBtn" class="btn-gold">เข้าสู่ลานประลอง</button>
            </div>
        </div>

        <!-- หน้าเล่นเกมส์ -->
        <div id="game-screen" class="screen hidden">
            <h2 class="title" id="display-name">ผู้ท้าชิง</h2>
            
            <div class="coin-arena">
                <div id="coin" class="gold-coin">
                    <span id="coin-text">S</span>
                </div>
                <div id="distance-result" class="hidden">0.00 m</div>
            </div>

            <button id="tossBtn" class="btn-gold">โยนเหรียญ</button>
            <button id="viewBoardBtn" class="btn-text">ดูรายนามผู้ชนะ</button>
        </div>

        <!-- หน้ากระดานผู้นำ -->
        <div id="leaderboard-screen" class="screen hidden">
            <h2 class="title">Society Papers</h2>
            <p class="subtitle">สถิติการโยนเหรียญที่ไกลที่สุด</p>
            
            <ul id="leaderboard-list" class="leaderboard">
                <!-- รายชื่อจะถูกแทรกผ่าน JS -->
            </ul>
            
            <button id="backBtn" class="btn-text">กลับไปโยนเหรียญ</button>
        </div>
    </div>

    <!-- Firebase SDK (ใช้ Type Module) -->
    <script type="module" src="script.js"></script>
</body>
</html>

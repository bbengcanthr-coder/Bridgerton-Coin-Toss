<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridgerton Night SSU x BCU - Coin Toss</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <div id="login-screen" class="screen active">
            <h1 class="theme-title">Bridgerton Night</h1>
            <h2 class="theme-subtitle">SSU x BCU</h2>
            <div class="card">
                <p>โปรดลงนามเพื่อเข้าร่วมการแข่งขันโยนเหรียญเกียรติยศ<br>(ท่านมีสิทธิ์โยนได้เพียง 1 ครั้งเท่านั้น)</p>
                <input type="text" id="playerName" placeholder="กรอกชื่อของท่าน..." maxlength="15">
                <button id="startBtn" class="gold-btn">เข้าสู่ลานประลอง</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <span id="display-name">ผู้เล่น: -</span>
            </div>
            
            <div class="game-area">
                <div class="angle-meter">
                    <div id="angle-pointer"></div>
                </div>
                
                <div id="coin" class="gold-coin">
                    <span id="coin-name">Name</span>
                </div>
            </div>

            <div class="controls">
                <div class="power-bar-container">
                    <div id="power-bar"></div>
                </div>
                <button id="throwBtn" class="gold-btn">กดค้างเพื่อสะสมพลัง / ปล่อยเพื่อโยน</button>
            </div>
        </div>

        <div id="leaderboard-screen" class="screen">
            <h1 class="theme-title">Leaderboard</h1>
            <h2 id="result-distance">คุณโยนได้: 0 เมตร</h2>
            <div class="leaderboard-card">
                <ol id="leaderboard-list">
                    </ol>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
